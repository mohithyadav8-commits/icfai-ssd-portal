<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SSD Staff Queue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #e0e5ec;
      --shadow-light: #ffffff;
      --shadow-dark: #a3b1c6;
      --primary: #1a365d;
      --accent: #2b6cb0;
    }
    body {
      background: var(--bg);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 25px;
      margin: 0;
    }
    .neu-box {
      background: var(--bg);
      border-radius: 18px;
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
      padding: 24px;
      margin-bottom: 20px;
    }
    .neu-input {
      border: none;
      border-radius: 10px;
      padding: 12px;
      background: var(--bg);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0;
      outline: none;
      font-size: 14px;
    }
    .neu-btn {
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      background: var(--bg);
      font-weight: 600;
      color: var(--primary);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      transition: 0.2s ease;
    }
    .neu-btn:active {
      box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
    }
    .ticket-card {
      background: var(--bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    }
  </style>
</head>
<body>

<!-- Login / Profile Selection Screen -->
<div class="neu-box" style="max-width: 450px; margin: 40px auto;" id="loginBox">
  <h3 style="color:var(--primary); text-align:center; margin-top:0;">SSD Staff Login</h3>
  <label style="font-size:14px; color:#555;">Choose your profile to see assigned students:</label>
  <select id="staffSelect" class="neu-input" style="margin-top:10px;">
    <option value="">-- Choose Profile --</option>
    <option value="Person 1">Person 1</option>
    <option value="Person 2">Person 2</option>
    <option value="Person 3">Person 3</option>
    <option value="Person 4">Person 4</option>
    <option value="Person 5">Person 5</option>
  </select>
  <button onclick="loginStaff()" type="button" class="neu-btn" style="width: 100%; margin-top: 15px; color:var(--accent);">Open Desk Queue</button>
</div>

<!-- Desk View Screen -->
<div id="deskView" style="display:none; max-width: 850px; margin: auto;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
    <h2 id="staffHeader" style="color:var(--primary); margin:0;">Staff Dashboard</h2>
    <button onclick="location.reload()" type="button" class="neu-btn">Switch User</button>
  </div>
  <div id="ticketsContainer"></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDv4W1ZgAC4r8Zo6v65qu0EEy6ea9O1lYk",
    authDomain: "icfai-ssd-system.firebaseapp.com",
    projectId: "icfai-ssd-system",
    storageBucket: "icfai-ssd-system.firebasestorage.app",
    messagingSenderId: "949638357634",
    appId: "1:949638357634:web:4956fffd372232f9418a9b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let activeStaff = '';

  function loginStaff() {
    activeStaff = document.getElementById('staffSelect').value;
    if (!activeStaff) {
      alert('Please select your staff profile name from the dropdown.');
      return;
    }
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('deskView').style.display = 'block';
    document.getElementById('staffHeader').innerText = "Assigned Queue: " + activeStaff;
    loadQueue();
  }

  function loadQueue() {
    // Listens in real time without triggering Firestore index errors
    db.collection('enquiries').onSnapshot(function(snapshot) {
      const container = document.getElementById('ticketsContainer');
      container.innerHTML = '';
      let activeCount = 0;

      snapshot.forEach(function(doc) {
        const d = doc.data();
        const id = doc.id;
        
        // Filter in browser memory for instant display
        const isAssigned = (d.assignedStaff === activeStaff || d.assignedStaff === 'No Staff Available');
        const isOpen = (d.status === 'Open' || d.status === 'Open - Pending Action');

        if (isAssigned && isOpen) {
          activeCount++;
          const secSem = (d.sec || d.sem) ? `${d.sec || ''} | ${d.sem || ''}` : 'Faculty Inquiry';
          const enroll = d.enrollment && d.enrollment !== 'FACULTY' ? `(${d.enrollment})` : '';

          container.innerHTML += `
            <div class="ticket-card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <b style="color:var(--primary); font-size:16px;">${d.type}: ${d.name} ${enroll}</b>
                <span style="color:#c53030; font-weight:700; font-size:13px; background:#ffd8d8; padding:3px 8px; border-radius:6px;">Status: ${d.status}</span>
              </div>
              <p style="margin: 8px 0; font-size:13px; color:#555;"><b>Details:</b> ${secSem}</p>
              <div style="background:#d9e0ea; padding:12px; border-radius:8px; margin: 10px 0; font-size:14px; color:#222;">
                <b>Query:</b> ${d.query}
              </div>
              <label style="font-size:13px; font-weight:600; color:#444;">Resolution / Solution remarks:</label>
              <textarea id="sol_${id}" class="neu-input" rows="2" placeholder="State solution given..."></textarea>
              
              <label style="font-size:13px; font-weight:600; color:#444;">Student Email (Optional):</label>
              <input type="email" id="mail_${id}" class="neu-input" value="${d.studentEmail || ''}" placeholder="student@icfai.edu">

              <div style="margin-top:14px; display:flex; gap:12px;">
                <button class="neu-btn" style="color:green; flex:1;" type="button" onclick="resolveTicket('${id}')">Resolve & Close Ticket</button>
                <button class="neu-btn" style="color:#c53030; flex:1;" type="button" onclick="keepPending('${id}')">No Solution (Keep Open)</button>
              </div>
            </div>
          `;
        }
      });

      if (activeCount === 0) {
        container.innerHTML = '<div class="neu-box" style="text-align:center;"><p style="color:#666; margin:0;">No pending enquiries for this desk right now.</p></div>';
      }
    }, function(error) {
      console.error("Realtime listener error:", error);
      alert("Error loading queue: " + error.message);
    });
  }

  function resolveTicket(id) {
    const sol = document.getElementById('sol_' + id).value.trim();
    if (!sol) {
      if (!confirm("No remarks entered. Are you sure you want to mark this query resolved?")) return;
    }

    db.collection('enquiries').doc(id).update({
      status: 'Resolved',
      solution: sol,
      resolvedBy: activeStaff,
      resolvedDate: new Date().toISOString()
    })
    .then(() => alert("Ticket marked as Resolved and closed."))
    .catch(err => alert("Error: " + err.message));
  }

  function keepPending(id) {
    const mail = document.getElementById('mail_' + id).value.trim();
    db.collection('enquiries').doc(id).update({
      status: 'Open - Pending Action',
      studentEmail: mail,
      flaggedBy: activeStaff,
      flaggedDate: new Date().toISOString()
    })
    .then(() => alert("Ticket recorded as Open - Pending Action."))
    .catch(err => alert("Error: " + err.message));
  }
</script>
</body>
</html>
