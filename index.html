<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICFAI SSD - Visitor Desk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #e0e5ec;
      --shadow-light: #ffffff;
      --shadow-dark: #a3b1c6;
      --primary: #1a365d;
      --accent: #2b6cb0;
      --crimson: #dc2626;
      --amber: #d97706;
      --green: #16a34a;
    }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }
    .layout-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      width: 100%;
      max-width: 1050px;
      margin: auto;
    }
    @media (max-width: 900px) {
      .layout-wrapper { flex-direction: column-reverse; align-items: center; }
    }
    .neu-card {
      background: var(--bg);
      border-radius: 24px;
      box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
      padding: 35px;
      width: 100%;
      max-width: 560px;
      box-sizing: border-box;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { max-height: 52px; margin-bottom: 10px; }
    .tab-container {
      display: flex;
      background: var(--bg);
      border-radius: 15px;
      padding: 6px;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      margin-bottom: 22px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--bg);
      color: var(--accent);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    }
    .neu-input, .neu-select, .neu-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 6px;
      margin-bottom: 16px;
      box-shadow: inset 4px 4px 7px var(--shadow-dark), inset -4px -4px 7px var(--shadow-light);
      outline: none;
      font-size: 14px;
      color: #1e293b;
    }
    .neu-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .neu-btn:hover { box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); }
    .neu-btn:active { box-shadow: inset 4px 4px 7px var(--shadow-dark), inset -4px -4px 7px var(--shadow-light); }
    .grid-2 { display: flex; gap: 12px; }
    .grid-2 > div { flex: 1; }

    #sideNoticeContainer {
      display: none;
      width: 100%;
      max-width: 320px;
      background: var(--bg);
      border-radius: 20px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
      border-left: 5px solid var(--amber);
      animation: fadeIn 0.4s ease-out;
    }
    .notice-header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--amber);
      background: #fef3c7;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .status-alert-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.4;
      color: #991b1b;
      animation: fadeIn 0.25s ease;
    }

    /* Token Slip Modal */
    #tokenModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .token-box {
      background: var(--bg);
      border-radius: 24px;
      padding: 35px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 16px 16px 32px var(--shadow-dark), -16px -16px 32px var(--shadow-light);
      box-sizing: border-box;
      animation: fadeIn 0.3s ease-out;
    }
    .token-display {
      font-size: 54px;
      font-weight: 900;
      color: var(--primary);
      margin: 15px 0;
      letter-spacing: 2px;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="layout-wrapper">
  
  <div class="neu-card">
    <div class="header">
      <img src="logo.png" alt="ICFAI Foundation for Higher Education" onerror="this.style.display='none'">
      <h3 style="color:var(--primary); margin: 5px 0;">Student Service Department (SSD)</h3>
      <p style="color:#64748b; font-size: 13px; margin:0;">Visitor Enquiry & Check-in Desk</p>
    </div>

    <div class="tab-container">
      <button class="tab-btn active" id="tabStudent" type="button" onclick="switchTab('student')">Student Enquiry</button>
      <button class="tab-btn" id="tabFaculty" type="button" onclick="switchTab('faculty')">Faculty Enquiry</button>
    </div>

    <!-- Student Form -->
    <form id="studentForm">
      <label style="font-size:13px; font-weight:600;">Enrollment Number</label>
      <input type="text" id="stuEnroll" class="neu-input" placeholder="Type enrollment no..." oninput="lookupStudent()" required>

      <label style="font-size:13px; font-weight:600;">Full Name</label>
      <input type="text" id="stuName" class="neu-input" placeholder="Auto-populated / Editable" required>

      <div class="grid-2">
        <div>
          <label style="font-size:13px; font-weight:600;">Section</label>
          <input type="text" id="stuSec" class="neu-input" placeholder="e.g. A">
        </div>
        <div>
          <label style="font-size:13px; font-weight:600;">Semester</label>
          <input type="text" id="stuSem" class="neu-input" placeholder="e.g. 1st Sem">
        </div>
      </div>

      <label style="font-size:13px; font-weight:600;">Select SSD Staff Member</label>
      <select id="stuStaff" class="neu-select staffDropdown" onchange="checkStaffStatus('stuStaff', 'stuStatusAlert', 'stuSubmitBtn')" required>
        <option value="">-- Choose Staff Member --</option>
      </select>

      <div id="stuStatusAlert" class="status-alert-box"></div>

      <label style="font-size:13px; font-weight:600;">Reason for Visit / Query</label>
      <textarea id="stuQuery" rows="3" class="neu-textarea" placeholder="State your enquiry briefly..." required></textarea>

      <button type="submit" id="stuSubmitBtn" class="neu-btn">Submit Student Enquiry</button>
    </form>

    <!-- Faculty Form -->
    <form id="facultyForm" style="display:none;">
      <label style="font-size:13px; font-weight:600;">Faculty Name</label>
      <input type="text" id="facName" list="facList" class="neu-input" placeholder="Type or select faculty name..." required>
      <datalist id="facList"></datalist>

      <label style="font-size:13px; font-weight:600;">Select SSD Staff Member</label>
      <select id="facStaff" class="neu-select staffDropdown" onchange="checkStaffStatus('facStaff', 'facStatusAlert', 'facSubmitBtn')" required>
        <option value="">-- Choose Staff Member --</option>
      </select>

      <div id="facStatusAlert" class="status-alert-box"></div>

      <label style="font-size:13px; font-weight:600;">Brief Query</label>
      <textarea id="facQuery" rows="3" class="neu-textarea" placeholder="State query briefly..." required></textarea>

      <button type="submit" id="facSubmitBtn" class="neu-btn">Submit Faculty Enquiry</button>
    </form>
  </div>

  <div id="sideNoticeContainer">
    <div class="notice-header-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      Official Announcement
    </div>
    <h4 id="sideNoticeTitle" style="margin:0 0 8px 0; color:var(--primary); font-size:16px;">Notice Board</h4>
    <div id="sideNoticeBody" style="font-size:13px; line-height:1.55; color:#334155;"></div>
  </div>

</div>

<!-- Digital Queue Token Slip Modal -->
<div id="tokenModal">
  <div class="token-box">
    <div style="font-size:13px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1px;">ICFAI Student Service Department</div>
    <h3 style="margin:6px 0 0 0; color:var(--primary);">Your Digital Queue Token</h3>
    <div class="token-display" id="tokenNumberDisplay">S-01</div>
    <div style="font-size:15px; font-weight:600; color:#1e293b;" id="tokenVisitorName">Student Name</div>
    <p style="font-size:13px; color:#64748b; margin:10px 0 20px 0;" id="tokenDeskMsg">Please proceed to the waiting area. Your assigned desk will attend to you shortly.</p>
    <button type="button" class="neu-btn" onclick="closeTokenModal()">Acknowledge & Close</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDv4W1ZgAC4r8Zo6v65qu0EEy6ea9O1lYk",
    authDomain: "icfai-ssd-system.firebaseapp.com",
    projectId: "icfai-ssd-system",
    storageBucket: "icfai-ssd-system.firebasestorage.app",
    messagingSenderId: "949638357634",
    appId: "1:949638357634:web:4956fffd372232f9418a9b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let studentMap = {};
  let facultyList = [];
  let staffStatusMap = {};
  let noticeConfig = { active: false, title: '', message: '' };
  let currentActiveTab = 'student';

  fetch('Combined data Student List CSV.json').then(r => r.json()).then(data => {
    data.forEach(item => {
      if (item.Enrolno) {
        const k = String(item.Enrolno).trim().toUpperCase();
        studentMap[k] = {
          name: item.Name || '',
          sec: item["Sem I - Section"] || '',
          sem: item.Semester == 1 ? "1st Sem" : (item.Semester == 3 ? "3rd Sem" : item.Semester + "th Sem")
        };
      }
    });
  }).catch(() => {});

  fetch('Faculty List.json').then(r => r.json()).then(data => {
    const dl = document.getElementById('facList');
    data.forEach(item => {
      const n = (item["Faculty Name (Dr./Prof.)"] || "").trim();
      if (n && n !== "VF" && !facultyList.includes(n)) {
        facultyList.push(n);
        const opt = document.createElement('option');
        opt.value = n;
        dl.appendChild(opt);
      }
    });
  }).catch(() => {});

  db.collection('directory').doc('master').onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.students) studentMap = Object.assign({}, studentMap, d.students);
      if (d.faculty && Array.isArray(d.faculty)) {
        facultyList = d.faculty;
        const dl = document.getElementById('facList');
        dl.innerHTML = '';
        facultyList.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          dl.appendChild(opt);
        });
      }
    }
  });

  db.collection('settings').doc('staffList').onSnapshot(doc => {
    const staffList = (doc.exists && doc.data().names) ? doc.data().names : ["Person 1", "Person 2", "Person 3", "Person 4", "Person 5"];
    document.querySelectorAll('.staffDropdown').forEach(sel => {
      const prev = sel.value;
      sel.innerHTML = '<option value="">-- Choose Staff Member --</option>';
      staffList.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.innerText = p;
        sel.appendChild(opt);
      });
      const noStaff = document.createElement('option');
      noStaff.value = "No Staff Available"; noStaff.innerText = "No Staff Available";
      sel.appendChild(noStaff);
      if (prev) sel.value = prev;
    });
  });

  db.collection('settings').doc('staffAvailability').onSnapshot(doc => {
    if (doc.exists) {
      staffStatusMap = doc.data() || {};
      checkStaffStatus('stuStaff', 'stuStatusAlert', 'stuSubmitBtn');
      checkStaffStatus('facStaff', 'facStatusAlert', 'facSubmitBtn');
    }
  });

  db.collection('settings').doc('broadcast').onSnapshot(doc => {
    if (doc.exists) {
      noticeConfig = {
        active: !!doc.data().active,
        title: doc.data().title || "Notice Board",
        message: doc.data().message || ""
      };
      renderNoticeWidget();
    }
  });

  function renderNoticeWidget() {
    const box = document.getElementById('sideNoticeContainer');
    if (currentActiveTab === 'student' && noticeConfig.active && noticeConfig.message) {
      document.getElementById('sideNoticeTitle').innerText = noticeConfig.title;
      document.getElementById('sideNoticeBody').innerText = noticeConfig.message;
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
    }
  }

  function switchTab(type) {
    currentActiveTab = type;
    document.getElementById('studentForm').style.display = type === 'student' ? 'block' : 'none';
    document.getElementById('facultyForm').style.display = type === 'faculty' ? 'block' : 'none';
    document.getElementById('tabStudent').classList.toggle('active', type === 'student');
    document.getElementById('tabFaculty').classList.toggle('active', type === 'faculty');
    renderNoticeWidget();
  }

  function checkStaffStatus(selectId, alertBoxId, submitBtnId) {
    const staff = document.getElementById(selectId).value;
    const alertBox = document.getElementById(alertBoxId);
    const submitBtn = document.getElementById(submitBtnId);
    if (!staff || staff === "No Staff Available") {
      alertBox.style.display = 'none';
      submitBtn.disabled = false;
      return;
    }
    const state = staffStatusMap[staff] || 'Available';
    if (state === 'Lunch Break' || state === 'In Meeting') {
      alertBox.innerHTML = `<strong>Unavailable:</strong> ${staff} is currently <strong>${state.toLowerCase()}</strong>. Please visit after some time or select another staff member.`;
      alertBox.style.display = 'block';
      submitBtn.disabled = true;
    } else if (state === 'On Leave') {
      alertBox.innerHTML = `<strong>On Leave:</strong> ${staff} is on leave today. Please select another SSD staff member to submit your enquiry.`;
      alertBox.style.display = 'block';
      submitBtn.disabled = true;
    } else {
      alertBox.style.display = 'none';
      submitBtn.disabled = false;
    }
  }

  function lookupStudent() {
    const v = document.getElementById('stuEnroll').value.trim().toUpperCase();
    if (studentMap[v]) {
      document.getElementById('stuName').value = studentMap[v].name || '';
      document.getElementById('stuSec').value = studentMap[v].sec || '';
      document.getElementById('stuSem').value = studentMap[v].sem || '';
    }
  }

  // Generate Daily Sequential Token (e.g., S-01, F-01)
  async function generateToken(prefix) {
    const todayStr = new Date().toISOString().substring(0, 10);
    const tokenDocRef = db.collection('tokenCounters').doc(todayStr);
    return db.runTransaction(async transaction => {
      const doc = await transaction.get(tokenDocRef);
      let current = 0;
      if (doc.exists && doc.data()[prefix]) {
        current = doc.data()[prefix];
      }
      const next = current + 1;
      transaction.set(tokenDocRef, { [prefix]: next }, { merge: true });
      const padded = next < 10 ? '0' + next : String(next);
      return `${prefix}-${padded}`;
    });
  }

  // Check Repeat Visitor Status (Last 7 Days)
  async function checkRecentVisits(enrollment) {
    const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
    try {
      const snap = await db.collection('enquiries')
        .where('enrollment', '==', enrollment)
        .where('createdDate', '>=', sevenDaysAgo)
        .get();
      return snap.size;
    } catch (e) {
      return 0;
    }
  }

  function showTokenModal(token, name, staff) {
    document.getElementById('tokenNumberDisplay').innerText = token;
    document.getElementById('tokenVisitorName').innerText = name;
    document.getElementById('tokenDeskMsg').innerText = `Assigned to: ${staff}. Please take a seat in the waiting area.`;
    document.getElementById('tokenModal').style.display = 'flex';
  }

  function closeTokenModal() {
    document.getElementById('tokenModal').style.display = 'none';
  }

  document.getElementById('studentForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('stuSubmitBtn');
    btn.disabled = true;
    btn.innerText = "Generating Token...";

    const enr = document.getElementById('stuEnroll').value.trim().toUpperCase();
    const name = document.getElementById('stuName').value.trim();
    const sec = document.getElementById('stuSec').value.trim();
    const sem = document.getElementById('stuSem').value.trim();
    const staff = document.getElementById('stuStaff').value;
    const query = document.getElementById('stuQuery').value.trim();

    try {
      // 1. Auto-update Student Directory
      if (!studentMap[enr] || studentMap[enr].name !== name) {
        studentMap[enr] = { name: name, sec: sec, sem: sem };
        db.collection('directory').doc('master').set({
          students: { [enr]: { name: name, sec: sec, sem: sem } }
        }, { merge: true }).catch(() => {});
      }

      // 2. Repeat Visitor Detection
      const priorVisits = await checkRecentVisits(enr);
      const isRepeat = priorVisits >= 1; // already visited within 7 days

      // 3. Generate Sequential Token
      const token = await generateToken('S');

      // 4. Save Enquiry with Millisecond Tracking
      const nowIso = new Date().toISOString();
      await db.collection('enquiries').add({
        type: 'Student',
        tokenNumber: token,
        enrollment: enr,
        name: name,
        sec: sec,
        sem: sem,
        assignedStaff: staff,
        query: query,
        status: 'Open',
        isRepeatVisitor: isRepeat,
        priorVisitCount: priorVisits,
        createdDate: nowIso,
        startTimestamp: Date.now()
      });

      showTokenModal(token, name, staff);
      document.getElementById('studentForm').reset();
      document.getElementById('stuStatusAlert').style.display = 'none';
    } catch (err) {
      alert("Submission error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Submit Student Enquiry";
    }
  });

  document.getElementById('facultyForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('facSubmitBtn');
    btn.disabled = true;
    btn.innerText = "Generating Token...";

    const facName = document.getElementById('facName').value.trim();
    const staff = document.getElementById('facStaff').value;
    const query = document.getElementById('facQuery').value.trim();

    try {
      if (facName && !facultyList.includes(facName)) {
        facultyList.push(facName);
        db.collection('directory').doc('master').set({
          faculty: firebase.firestore.FieldValue.arrayUnion(facName)
        }, { merge: true }).catch(() => {});
      }

      const token = await generateToken('F');
      const nowIso = new Date().toISOString();

      await db.collection('enquiries').add({
        type: 'Faculty',
        tokenNumber: token,
        enrollment: 'FACULTY',
        name: facName,
        sec: '',
        sem: '',
        assignedStaff: staff,
        query: query,
        status: 'Open',
        isRepeatVisitor: false,
        createdDate: nowIso,
        startTimestamp: Date.now()
      });

      showTokenModal(token, facName, staff);
      document.getElementById('facultyForm').reset();
      document.getElementById('facStatusAlert').style.display = 'none';
    } catch (err) {
      alert("Submission error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Submit Faculty Enquiry";
    }
  });
</script>
</body>
</html>
