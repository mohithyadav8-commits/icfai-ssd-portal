<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICFAI SSD - Visitor Desk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #e0e5ec;
      --shadow-light: #ffffff;
      --shadow-dark: #a3b1c6;
      --primary: #1a365d;
      --accent: #2b6cb0;
      --crimson: #dc2626;
    }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .neu-card {
      background: var(--bg);
      border-radius: 24px;
      box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
      padding: 35px;
      width: 100%;
      max-width: 580px;
      box-sizing: border-box;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { max-height: 55px; margin-bottom: 10px; }
    
    /* Live Notice Board Banner */
    #noticeBanner {
      display: none;
      width: 100%;
      max-width: 580px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
      padding: 14px 18px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-sizing: border-box;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
      animation: fadeIn 0.3s ease;
    }

    .tab-container {
      display: flex;
      background: var(--bg);
      border-radius: 15px;
      padding: 6px;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      margin-bottom: 25px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--bg);
      color: var(--accent);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    }
    .neu-input, .neu-select, .neu-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 6px;
      margin-bottom: 18px;
      box-shadow: inset 4px 4px 7px var(--shadow-dark), inset -4px -4px 7px var(--shadow-light);
      outline: none;
      font-size: 14px;
      color: #1e293b;
    }
    .neu-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .neu-btn:hover {
      box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    }
    .neu-btn:active {
      box-shadow: inset 4px 4px 7px var(--shadow-dark), inset -4px -4px 7px var(--shadow-light);
    }
    .grid-2 { display: flex; gap: 12px; }
    .grid-2 > div { flex: 1; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<!-- Live SSD Office Notice Display -->
<div id="noticeBanner">
  <strong id="noticeTitle">Important Notice:</strong>
  <div id="noticeBody" style="margin-top:4px;"></div>
</div>

<div class="neu-card">
  <div class="header">
    <img src="logo.png" alt="ICFAI Foundation for Higher Education" onerror="this.style.display='none'">
    <h3 style="color:var(--primary); margin: 5px 0;">Student Service Department (SSD)</h3>
    <p style="color:#64748b; font-size: 13px; margin:0;">Visitor Enquiry & Check-in Desk</p>
  </div>

  <div class="tab-container">
    <button class="tab-btn active" id="tabStudent" type="button" onclick="switchTab('student')">Student Enquiry</button>
    <button class="tab-btn" id="tabFaculty" type="button" onclick="switchTab('faculty')">Faculty Enquiry</button>
  </div>

  <!-- Student Form -->
  <form id="studentForm">
    <label style="font-size:13px; font-weight:600;">Enrollment Number</label>
    <input type="text" id="stuEnroll" class="neu-input" placeholder="Type enrollment no..." oninput="lookupStudent()" required>

    <label style="font-size:13px; font-weight:600;">Full Name</label>
    <input type="text" id="stuName" class="neu-input" placeholder="Auto-populated / Editable" required>

    <div class="grid-2">
      <div>
        <label style="font-size:13px; font-weight:600;">Section</label>
        <input type="text" id="stuSec" class="neu-input" placeholder="e.g. A">
      </div>
      <div>
        <label style="font-size:13px; font-weight:600;">Semester</label>
        <input type="text" id="stuSem" class="neu-input" placeholder="e.g. 1st Sem">
      </div>
    </div>

    <label style="font-size:13px; font-weight:600;">Select SSD Staff Member</label>
    <select id="stuStaff" class="neu-select staffDropdown" required>
      <option value="">-- Choose Staff Member --</option>
      <option value="No Staff Available">No Staff Available</option>
    </select>

    <label style="font-size:13px; font-weight:600;">Reason for Visit / Query</label>
    <textarea id="stuQuery" rows="3" class="neu-textarea" placeholder="State your enquiry briefly..." required></textarea>

    <button type="submit" id="stuSubmitBtn" class="neu-btn">Submit Student Enquiry</button>
  </form>

  <!-- Faculty Form -->
  <form id="facultyForm" style="display:none;">
    <label style="font-size:13px; font-weight:600;">Faculty Name</label>
    <input type="text" id="facName" list="facList" class="neu-input" placeholder="Type or choose faculty name..." required>
    <datalist id="facList"></datalist>

    <label style="font-size:13px; font-weight:600;">Select SSD Staff Member</label>
    <select id="facStaff" class="neu-select staffDropdown" required>
      <option value="">-- Choose Staff Member --</option>
      <option value="No Staff Available">No Staff Available</option>
    </select>

    <label style="font-size:13px; font-weight:600;">Brief Query</label>
    <textarea id="facQuery" rows="3" class="neu-textarea" placeholder="State query briefly..." required></textarea>

    <button type="submit" id="facSubmitBtn" class="neu-btn">Submit Faculty Enquiry</button>
  </form>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDv4W1ZgAC4r8Zo6v65qu0EEy6ea9O1lYk",
    authDomain: "icfai-ssd-system.firebaseapp.com",
    projectId: "icfai-ssd-system",
    storageBucket: "icfai-ssd-system.firebasestorage.app",
    messagingSenderId: "949638357634",
    appId: "1:949638357634:web:4956fffd372232f9418a9b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let studentMap = {};

  // 1. Ingest Static Fallback Files
  fetch('Combined data Student List CSV.json').then(r => r.json()).then(data => {
    data.forEach(item => {
      if (item.Enrolno) {
        const k = String(item.Enrolno).trim().toUpperCase();
        studentMap[k] = {
          name: item.Name || '',
          sec: item["Sem I - Section"] || '',
          sem: item.Semester == 1 ? "1st Sem" : (item.Semester == 3 ? "3rd Sem" : item.Semester + "th Sem")
        };
      }
    });
  }).catch(() => {});

  fetch('Faculty List.json').then(r => r.json()).then(data => {
    const dl = document.getElementById('facList');
    data.forEach(item => {
      const n = (item["Faculty Name (Dr./Prof.)"] || "").trim();
      if (n && n !== "VF") {
        const opt = document.createElement('option');
        opt.value = n;
        dl.appendChild(opt);
      }
    });
  }).catch(() => {});

  // 2. Real-Time Directory Sync from Firestore (Uploaded via Settings)
  db.collection('directory').doc('master').onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.students) Object.assign(studentMap, d.students);
      if (d.faculty && Array.isArray(d.faculty)) {
        const dl = document.getElementById('facList');
        dl.innerHTML = '';
        d.faculty.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          dl.appendChild(opt);
        });
      }
    }
  });

  // 3. Dynamic SSD Staff List Real-Time Listener
  db.collection('settings').doc('staffList').onSnapshot(doc => {
    const staffList = (doc.exists && doc.data().names) ? doc.data().names : ["Person 1", "Person 2", "Person 3", "Person 4", "Person 5"];
    document.querySelectorAll('.staffDropdown').forEach(sel => {
      sel.innerHTML = '<option value="">-- Choose Staff Member --</option>';
      staffList.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.innerText = p;
        sel.appendChild(opt);
      });
      const noStaffOpt = document.createElement('option');
      noStaffOpt.value = "No Staff Available";
      noStaffOpt.innerText = "No Staff Available";
      sel.appendChild(noStaffOpt);
    });
  });

  // 4. Real-time Office Broadcast / Announcement Listener
  db.collection('settings').doc('broadcast').onSnapshot(doc => {
    const banner = document.getElementById('noticeBanner');
    if (doc.exists && doc.data().active && doc.data().message) {
      document.getElementById('noticeTitle').innerText = doc.data().title || "SSD Notice:";
      document.getElementById('noticeBody').innerText = doc.data().message;
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }
  });

  function switchTab(type) {
    document.getElementById('studentForm').style.display = type === 'student' ? 'block' : 'none';
    document.getElementById('facultyForm').style.display = type === 'faculty' ? 'block' : 'none';
    document.getElementById('tabStudent').classList.toggle('active', type === 'student');
    document.getElementById('tabFaculty').classList.toggle('active', type === 'faculty');
  }

  function lookupStudent() {
    const v = document.getElementById('stuEnroll').value.trim().toUpperCase();
    if (studentMap[v]) {
      document.getElementById('stuName').value = studentMap[v].name;
      document.getElementById('stuSec').value = studentMap[v].sec;
      document.getElementById('stuSem').value = studentMap[v].sem;
    }
  }

  document.getElementById('studentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('stuSubmitBtn');
    btn.disabled = true;
    btn.innerText = "Transmitting...";

    db.collection('enquiries').add({
      type: 'Student',
      enrollment: document.getElementById('stuEnroll').value.trim().toUpperCase(),
      name: document.getElementById('stuName').value.trim(),
      sec: document.getElementById('stuSec').value.trim(),
      sem: document.getElementById('stuSem').value.trim(),
      assignedStaff: document.getElementById('stuStaff').value,
      query: document.getElementById('stuQuery').value.trim(),
      status: 'Open',
      createdDate: new Date().toISOString()
    })
    .then(() => {
      alert('Enquiry logged successfully.');
      document.getElementById('studentForm').reset();
    })
    .catch(err => alert("Error submitting: " + err.message))
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Submit Student Enquiry";
    });
  });

  document.getElementById('facultyForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('facSubmitBtn');
    btn.disabled = true;
    btn.innerText = "Transmitting...";

    db.collection('enquiries').add({
      type: 'Faculty',
      enrollment: 'FACULTY',
      name: document.getElementById('facName').value.trim(),
      sec: '',
      sem: '',
      assignedStaff: document.getElementById('facStaff').value,
      query: document.getElementById('facQuery').value.trim(),
      status: 'Open',
      createdDate: new Date().toISOString()
    })
    .then(() => {
      alert('Faculty inquiry registered.');
      document.getElementById('facultyForm').reset();
    })
    .catch(err => alert("Error submitting: " + err.message))
    .finally(() => {
      btn.disabled = false;
      btn.innerText = "Submit Faculty Enquiry";
    });
  });
</script>
</body>
</html>
